name: test-kind-e2e

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - 'main'
    paths:
      - 'clusters/kind-cluster/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  statuses: write
  checks: write

jobs:
  kind:
    if: startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0
      - name: Install Flux
        uses: fluxcd/flux2/action@main
      - name: Init Kind action
        uses: helm/kind-action@v1.13.0
        with:
          cluster_name: veritable-flux-infra
          config: ./scripts/kind-cluster-config.yaml
      - name: Install Flux to cluster
        run: flux install
      - name: Configure Git
        run: |
          git config user.name ${GITHUB_ACTOR}
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
      - name: Create surrogate branch
        run: |
          git checkout -b "kind/${GITHUB_HEAD_REF}"
      - name: Create source and kustomization
        if: success()
        run: |
          flux create source git flux-system \
          --url=${{ github.event.repository.html_url }} \
          --branch=main \
          --username=${GITHUB_ACTOR} \
          --password=${{ secrets.GITHUB_TOKEN }}
          flux create kustomization flux-system \
          --source=flux-system \
          --path=./clusters/kind-cluster/base
      - name: Verify Flux kustomizations
        run: |
          kubectl wait -A kustomization -l kustomize.toolkit.fluxcd.io/name=flux-system --for=condition=ready --timeout=10m
      - name: Verify Helm releases
        run: |
          kubectl wait -A helmrelease --all --for=condition=ready --timeout=10m
      - name: Patch GitOps branch to match PR
        if: success()
        run: |
          surrogate="kind/${GITHUB_HEAD_REF}"
          echo "${surrogate}"
          sed -i -r "s#(branch:).*#\1 $surrogate#" \
            ./clusters/kind-cluster/base/flux-system/gotk-sync.yaml
          git add ./clusters/kind-cluster/base/flux-system/gotk-sync.yaml
          git commit -am "Patch GitOps branch to match PR"
          git push -u origin $surrogate
      - name: Reconcile the update
        if: success()
        run: |
          surrogate="kind/${GITHUB_HEAD_REF}"
          flux suspend kustomization --all
          flux create source git flux-system \
          --url=${{ github.event.repository.html_url }} \
          --branch=${surrogate} \
          --username=${GITHUB_ACTOR} \
          --password=${{ secrets.GITHUB_TOKEN }}
          flux resume kustomization --all
          message=$(echo ${surrogate}"@sha1:"$(git log -n 1 ${surrogate} --pretty=format:"%H"))
          sets=$(kubectl get kustomizations -A -o jsonpath='{range .items[*]}{@.metadata.namespace}{"#"}{@.metadata.name}{"#"}{@.spec.sourceRef.name}{"\n"}{end}')
          ignore_pattern="monitoring-flux-infra"
          local_sets=$(echo "${sets}" | grep -v $ignore_pattern)
          for set in $local_sets; do
            ns=$(echo ${set} | cut -d "#" -f 1)
            k=$(echo ${set} | cut -d "#" -f 2)
            kubectl wait kustomization "${k}" -n "${ns}" --for='jsonpath={.status.conditions[?(@.type=="Ready")].message}=Applied revision: '"$message" --timeout=10m
          done
          kubectl get kustomizations -A
          kubectl wait helmrelease --all --all-namespaces --for=condition=ready --timeout=10m
          kubectl get helmreleases -A
      - name: Describe failing pods
        if: failure()
        run: |
          namespaces=$(kubectl get namespaces -o jsonpath='{.items[*].metadata.name}')
          for ns in $namespaces; do
            # Pods with a waiting container (CrashLoopBackOff, ImagePullBackOff, etc.)
            waiting_pods=$(kubectl get pods -n "$ns" -o jsonpath='{range .items[?(@.status.containerStatuses[*].state.waiting)]}{.metadata.name}{"\n"}{end}' 2>/dev/null)
            # Pods where a container is Running/Terminated but not Ready (e.g. failing readiness probes, stuck init containers)
            not_ready_pods=$(kubectl get pods -n "$ns" -o jsonpath='{range .items[?(@.status.containerStatuses[*].ready==false)]}{.metadata.name}{"\n"}{end}' 2>/dev/null)
            pods=$(printf '%s\n%s\n' "$waiting_pods" "$not_ready_pods" | sed '/^$/d' | sort -u)
            if [ -n "$pods" ]; then
              echo "::group::Namespace $ns - non-ready pods"
              echo "$pods"
              echo "::endgroup::"
              for pod in $pods; do
                echo "::group::Describe pod $ns/$pod"
                kubectl describe pod "$pod" -n "$ns"
                echo "::endgroup::"

                containers=$(kubectl get pod "$pod" -n "$ns" -o jsonpath='{.spec.containers[*].name}')
                for c in $containers; do
                  echo "::group::Logs $ns/$pod container=$c (current)"
                  kubectl logs "$pod" -n "$ns" -c "$c" --tail=500 || true
                  echo "::endgroup::"
                  echo "::group::Logs $ns/$pod container=$c (previous)"
                  kubectl logs "$pod" -n "$ns" -c "$c" --previous --tail=500 2>/dev/null || echo "(no previous logs)"
                  echo "::endgroup::"
                done

                init_containers=$(kubectl get pod "$pod" -n "$ns" -o jsonpath='{.spec.initContainers[*].name}')
                for c in $init_containers; do
                  echo "::group::Init container logs $ns/$pod container=$c (current)"
                  kubectl logs "$pod" -n "$ns" -c "$c" --tail=500 || true
                  echo "::endgroup::"
                  echo "::group::Init container logs $ns/$pod container=$c (previous)"
                  kubectl logs "$pod" -n "$ns" -c "$c" --previous --tail=500 2>/dev/null || echo "(no previous logs)"
                  echo "::endgroup::"
                done
              done
            fi

            echo "::group::Events for namespace $ns"
            kubectl get events -n "$ns" --sort-by=.lastTimestamp || true
            echo "::endgroup::"
          done
      - name: Debug Flux logs
        if: failure()
        run: flux logs --level=debug --all-namespaces
      - name: Return Flux log errors
        if: failure()
        run: flux logs --level=error --all-namespaces
      - name: Debug Flux controller state
        if: failure()
        run: kubectl -n flux-system get all
      - name: Debug source-controller logs
        if: failure()
        run: kubectl -n flux-system logs deploy/source-controller
      - name: Debug kustomize-controller logs
        if: failure()
        run: kubectl -n flux-system logs deploy/kustomize-controller
      - name: Debug helm-controller logs
        if: failure()
        run: kubectl -n flux-system logs deploy/helm-controller
      - name: Report all resources
        if: failure()
        run: flux get all --all-namespaces
      - name: Return to parent branch and delete the surrogate
        if: always()
        run: |
          parent=$(echo ${GITHUB_HEAD_REF} | sed "s#kind/renovate#renovate#" -)
          echo "${parent}"
          git checkout "${parent}" && \
          git push origin -d "kind/${parent}"
